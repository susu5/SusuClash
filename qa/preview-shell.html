<!doctype html><html lang="zh-CN" data-theme="cat"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>SusuClash 最新客户端 · 三主题完整交互</title><link rel="stylesheet" href="/client/cat/design-system.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--sc-color-window);color:var(--sc-color-text);font:14px/1.5 var(--sc-type-body-family)}.preview-wrap{max-width:1600px;margin:auto;padding:28px 24px 40px}h1{font-size:24px;line-height:1.3;margin:0 0 10px}.intro{margin:0;color:var(--sc-color-muted);font-size:14px}.toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:12px;margin:22px 0 24px;padding:18px;background:var(--sc-color-surface);border-radius:18px;box-shadow:var(--sc-shadow-raised)}label{display:grid;gap:6px;font-size:12px;min-width:160px}select,button{font:inherit;color:inherit}select{height:42px;min-width:170px;max-width:270px;padding:0 12px;border:1px solid color-mix(in srgb,var(--sc-color-muted) 24%,transparent);border-radius:10px;background:var(--sc-color-surface)}button{height:42px;padding:0 14px;border:0;border-radius:10px;background:var(--sc-color-surface);box-shadow:var(--sc-shadow-raised);cursor:pointer}button:active{box-shadow:var(--sc-shadow-inset)}:focus-visible{outline:2px solid var(--sc-color-accent);outline-offset:3px}.mode-note{margin-left:auto;max-width:360px;font-size:12px;color:var(--sc-color-muted)}.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.pane{min-width:0}.pane-heading{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px;gap:12px}.pane-heading strong{font-size:14px}.pane-heading span{font-size:12px;color:var(--sc-color-muted)}.frame{height:868px;box-shadow:0 18px 42px #40344d1c;background:var(--sc-color-surface);position:relative}.frame iframe{border:0;display:block;width:100%;height:100%;background:var(--sc-color-surface)}.reopen{display:none;min-height:140px;padding:24px;background:var(--sc-color-surface);border-radius:18px;align-items:center;justify-content:space-between;gap:16px}.pane.closed .frame{display:none}.pane.closed .reopen{display:flex}.pane.maximized{position:fixed;z-index:10;inset:18px;background:var(--sc-color-window);padding:16px;box-shadow:0 0 0 9999px #1a274377}.pane.maximized .frame{height:calc(100dvh - 110px)}.pane.maximized .pane-heading{height:44px}.foot{font-size:12px;color:var(--sc-color-muted);margin:22px 0 0}.status{min-height:20px;color:var(--sc-color-muted);font-size:12px;margin-top:14px}@media(max-width:1100px){.themes{grid-template-columns:1fr;max-width:500px;margin:auto;gap:28px}.preview-wrap{padding:22px 16px}.mode-note{margin-left:0;max-width:none;width:100%}}
</style></head><body><main class="preview-wrap"><h1>SusuClash 最新客户端 · 三主题完整交互</h1><p class="intro">当前客户端的完整页面与弹窗，共用已确认视觉规范。每个窗口可独立操作，也可用上方工具同时切换。</p><section class="toolbar" aria-label="完整交互预览工具"><label>同时查看页面<select id="pageSelect"><option value="home">首页</option><option value="lines">线路</option><option value="connections">连接</option><option value="settings">设置</option><option value="subscriptions">订阅管理</option><option value="subscriptionDetail">订阅详情</option><option value="subscriptionForm">新建订阅</option><option value="localImport">本地导入</option><option value="backups">备用节点</option><option value="runtime">内核与权限</option><option value="logs">运行日志</option><option value="about">关于</option><option value="connectionApp">应用连接</option><option value="connectionDetail">连接详情</option><option value="welcome">首次使用</option><option value="doctor:start">代理综合检查</option><option value="doctor:codex">Codex 专项</option><option value="doctor:history">检测历史</option><option value="doctor:help">检查帮助</option></select></label><label>弹窗示例<select id="dialogSelect"><option value="">选择一个弹窗</option></select></label><label>预览数据<select id="scenario"><option value="normal">正常示例</option><option value="empty">空数据 / 首次使用</option><option value="error">读取失败</option><option value="long">长名称</option></select></label><button id="reset">重置预览</button><span class="mode-note">隔离示例数据：操作只影响本页预览，不会修改真实代理、配置、启动项或内核。</span></section><section class="themes" aria-label="三主题完整客户端">__PANES__</section><p class="status" id="status" role="status">正在载入三主题完整界面…</p><p class="foot">视觉基准：author-v3 · 小字12px · 卡片18px · 窗口控制为预览模拟；实际功能逻辑沿用客户端。</p></main><script>
const names={cat:'猫猫 · 珍珠',fish:'游鱼 · 薄荷',whale:'鲸鱼 · 夜航'},panes=[...document.querySelectorAll('.pane')],status=document.getElementById('status'),ready=new Set();
function send(data){panes.forEach(p=>p.querySelector('iframe').contentWindow.postMessage({type:'preview-command',...data},location.origin))}
document.getElementById('pageSelect').addEventListener('change',e=>{document.getElementById('dialogSelect').value='';send({page:e.target.value})});document.getElementById('dialogSelect').addEventListener('change',e=>{if(e.target.value)send({dialog:e.target.value})});
async function reset(){ready.clear();const scenario=document.getElementById('scenario').value;await Promise.all(panes.map(async p=>{const slot=p.dataset.slot;await fetch('/__preview/reset/'+slot,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario})});p.classList.remove('closed','maximized');p.querySelector('iframe').src='/client/'+slot+'/?reset='+Date.now()}));document.getElementById('pageSelect').value=scenario==='empty'?'welcome':'home';document.getElementById('dialogSelect').value='';status.textContent='预览数据已重置。'}
document.getElementById('reset').addEventListener('click',reset);document.getElementById('scenario').addEventListener('change',reset);panes.forEach(p=>p.querySelector('[data-reopen]').addEventListener('click',()=>p.classList.remove('closed')));
addEventListener('message',e=>{if(e.origin!==location.origin)return;const p=panes.find(p=>p.querySelector('iframe').contentWindow===e.source);if(!p)return;if(e.data?.type==='preview-ready'){ready.add(e.data.slot);p.querySelector('.current-theme').textContent=names[e.data.theme]||names[e.data.slot];if(e.data.slot==='cat'){const select=document.getElementById('dialogSelect'),saved=select.value;select.replaceChildren(new Option('选择一个弹窗',''),...e.data.dialogs.map(d=>new Option(d.title,d.selector)));select.value=saved}status.textContent=ready.size+'/3 主题已就绪 · 全部页面与 '+e.data.dialogs.length+' 个弹窗可在同一入口体验。'}if(e.data?.type==='preview-window'){const a=e.data.action;if(a==='close'||a==='minimize')p.classList.add('closed');if(a==='maximize'){const on=p.classList.toggle('maximized');p.querySelector('iframe').contentWindow.postMessage({type:'preview-command',windowState:on?'maximized':'normal'},location.origin)}}});
</script></body></html>
